services:
  ao3-backup:
    image: ghcr.io/cr4player/ao3-bookmark-backup:latest
    # 如需本地修改源码后自构建，可取消下面注释并用 docker compose build 更新：
    # build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      OUT_DIR: /data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    stop_grace_period: 30s
    # 使用宿主机的日志驱动，兼容群晖 Container Manager 的日志页。
  ao3-web:
    image: ghcr.io/cr4player/ao3-bookmark-backup:latest
    command: ["--serve", "--host", "0.0.0.0", "--port", "8765"]
    depends_on:
      - ao3-backup
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      WEB_ALLOWED_HOSTS: "${WEB_BIND_IP:-127.0.0.1},${WEB_ALLOWED_HOSTS:-}"
      WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-0}
      AO3_MASTER_KEY: ${AO3_MASTER_KEY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-8765}:8765"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8765/health', timeout=5).close()"]
      interval: 1m
      timeout: 10s
